<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北张庄男神团</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent body scroll for full desktop experience */
        background-color: #f3f4f6;
      }
      /* Hide scrollbar for clean look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      .site-dock { max-width: calc(100vw - 24px); }
      .project-gallery { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; background: #fff; color: #202124; }
      .project-gallery-info { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #ededee; }
      .project-gallery-cover { width: 48px; height: 48px; flex-shrink: 0; object-fit: cover; border-radius: 4px; }
      .project-gallery-summary { min-width: 0; }
      .gallery-eyebrow { margin-bottom: 4px; color: #727279; font-size: 8px; font-weight: 500; letter-spacing: .16em; }
      .gallery-eyebrow span { color: #96969c; letter-spacing: .05em; }
      .gallery-count { margin-left: auto; padding-left: 12px; flex-shrink: 0; color: #626269; font-size: 18px; line-height: 1.2; font-weight: 300; font-variant-numeric: tabular-nums; text-align: right; }
      .gallery-count small { display: block; margin-top: 4px; color: #929298; font-size: 7px; letter-spacing: .14em; }
      .project-gallery-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
      .project-gallery-heading h1 { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 600; }
      .project-gallery-heading span { color: #858588; font-size: 10px; line-height: 1.4; }
      .project-gallery-summary p { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #65656a; }
      .project-gallery-content { display: flex; flex-direction: column; gap: 10px; padding: 10px; }
      .project-gallery-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
      .project-gallery-media { position: relative; flex-basis: 0; min-width: 0; margin: 0; overflow: hidden; border-radius: 3px; }
      .gallery-caption { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 1px 2px; color: #77777d; font-size: 9px; line-height: 1.5; letter-spacing: .07em; font-variant-numeric: tabular-nums; }
      .gallery-caption-total { color: #a0a0a6; }
      .gallery-signoff { padding: 30px 16px 36px; text-align: center; }
      .gallery-signoff-line { display: block; width: 24px; height: 1px; margin: 0 auto 16px; background: #c6c6cb; }
      .gallery-signoff p { margin: 0; color: #6b6b72; font-size: 12px; letter-spacing: .12em; }
      .gallery-signoff small { display: block; margin-top: 7px; color: #9999a0; font-size: 8px; letter-spacing: .18em; }
      .project-gallery-image { display: block; width: 100%; height: auto; }
      .project-gallery-video { display: block; width: 100%; height: auto; max-height: 72vh; background: #111; }
      .gallery-error { min-height: 140px; display: grid; place-items: center; background: #f5f5f5; color: #888; font-size: 12px; }
      @media (max-width: 639px) {
        .project-gallery-pair { flex-direction: column; }
        .project-gallery-media { flex-basis: auto; width: 100%; }
        .project-gallery-info { align-items: flex-start; gap: 10px; }
      }
      .dock-glass {
        position: relative;
        border-radius: 26px;
        border: 1px solid rgba(255,255,255,.55);
        background: linear-gradient(155deg, rgba(255,255,255,.28), rgba(255,255,255,.12) 48%, rgba(225,232,240,.22));
        -webkit-backdrop-filter: blur(24px) saturate(185%) brightness(1.08);
        backdrop-filter: blur(24px) saturate(185%) brightness(1.08);
        box-shadow: 0 12px 32px -10px rgba(15,23,42,.35), 0 2px 8px rgba(0,0,0,.09), inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(255,255,255,.3), inset 1px 0 1px rgba(255,255,255,.35);
      }
      .dock-glass::before, .dock-glass::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
      }
      .dock-glass::before {
        inset: 1px;
        border: 1px solid rgba(255,255,255,.18);
        box-shadow: inset 0 0 8px rgba(255,255,255,.14);
      }
      .dock-glass::after {
        background: radial-gradient(ellipse 180px 65px at var(--dock-light-x, 50%) 0%, rgba(255,255,255,.48), transparent 78%);
        opacity: .6;
        transition: opacity 200ms ease;
      }
      .dock-glass:hover::after { opacity: 1; }
      .dock-track { position: relative; z-index: 1; border-radius: inherit; }
      .dock-brand-slot { position: relative; width: 44px; height: 44px; pointer-events: none; }
      .dock-brand-image { position: absolute; width: 120%; height: 120%; max-width: none; left: -10%; top: -10%; object-fit: contain; filter: drop-shadow(0 3px 3px rgba(0,0,0,.12)); }
      .dock-separator { width: 1px; height: 32px; flex-shrink: 0; margin: 0 7px; border-radius: 1px; background: rgba(25,35,50,.18); box-shadow: 1px 0 rgba(255,255,255,.45); }
      @media (min-width: 768px) { .dock-brand-slot { width: 46px; height: 46px; } }
      @supports not (backdrop-filter: blur(1px)) { .dock-glass { background: rgba(231,235,240,.94); } }
      @media (prefers-reduced-transparency: reduce) { .dock-glass { background: #e7ebf0; -webkit-backdrop-filter: none; backdrop-filter: none; } }
      @media (prefers-reduced-motion: reduce) { .dock-glass::after { transition: none; } }
      @media (max-width: 767px) {
        .desktop-icons-viewport {
          overflow-y: auto;
          pointer-events: auto;
          touch-action: pan-y;
          padding-top: 44px;
          padding-bottom: 100px;
          scrollbar-width: none;
        }
        .desktop-icons {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          align-content: start;
          gap: 14px 10px;
          height: auto;
          padding: 8px 16px 24px;
        }
        .desktop-icon {
          position: relative !important;
          top: auto !important;
          left: auto !important;
          right: auto !important;
          bottom: auto !important;
          width: 100%;
          min-width: 0;
          cursor: pointer;
        }
        .desktop-icon-media {
          width: min(100%, 104px);
          height: auto;
          aspect-ratio: 1;
          padding: 8px;
          overflow: hidden;
          border-radius: 16px;
          background: rgba(255, 255, 255, 0.14);
          border: 1px solid rgba(255, 255, 255, 0.22);
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
          backdrop-filter: blur(12px);
        }
        .desktop-icon-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 10px;
          filter: none;
        }
        .site-dock {
          width: calc(100vw - 20px);
          max-width: 560px;
          bottom: max(8px, env(safe-area-inset-bottom));
        }
        .dock-track {
          width: 100%;
          overflow-x: auto;
          scrollbar-width: none;
          overscroll-behavior-x: contain;
          touch-action: pan-x;
        }
        .dock-track::-webkit-scrollbar { display: none; }
      }
      @media (max-width: 380px) {
        .desktop-icons { gap: 12px 8px; padding-inline: 10px; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
